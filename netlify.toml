# Launch Command — Netlify config
# Static frontend only. The API lives on the machine running `npm run dev`,
# reached through a tunnel — see public/api-base.js (TUNNEL_API_BASE).

[build]
  publish = "public"

# No functions, no build command: plain static deploy.

# v5 (on Vercel) is now the sole public face. Everything here — the root and
# the old v1–v4 paths — forwards to the v5 app. The v1–v4 files stay in the
# repo (dormant, reversible); they're just no longer served. 302 (temporary)
# so removing this redirect brings them straight back.
[[redirects]]
  from = "/*"
  to = "https://launch-command-v5.vercel.app/"
  status = 302
  force = true
